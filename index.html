<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>KYRNARC</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050506;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .badge {
    width: 64px;
    height: 64px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: rgba(232, 217, 181, 0.10);
    border: 1px solid rgba(232, 217, 181, 0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  h1 {
    font-size: clamp(22px, 5vw, 26px);
    font-weight: 900;
    letter-spacing: -0.5px;
    margin: 0 0 10px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.62);
    margin: 0 0 26px;
  }
  a.button {
    display: inline-block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 20px;
    background: #E8D9B5;
    color: #111113;
    font-weight: 900;
    font-size: 15px;
    text-decoration: none;
  }
  .close-note {
    margin-top: 16px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.34);
  }
  @media (max-width: 380px) {
    .badge { width: 56px; height: 56px; font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge" id="badge">&#10003;</div>
    <h1 id="title">Email подтверждён</h1>
    <p id="subtitle">Аккаунт KYRNARC успешно подтверждён. Вернитесь в приложение и нажмите &laquo;Я подтвердила email&raquo;.</p>
    <a class="button" id="open-app" href="nyth://login-callback/">Открыть KYRNARC</a>
    <div class="close-note" id="close-note">Эту вкладку можно закрыть.</div>
  </div>
  <script>
    (function () {
      var copy = {
        ru: {
          success: {
            title: "Email подтверждён",
            subtitle: "Аккаунт KYRNARC успешно подтверждён. Вернитесь в приложение и нажмите «Я подтвердила email».",
            button: "Открыть KYRNARC",
            close: "Эту вкладку можно закрыть.",
            badge: "✓",
          },
          problem: {
            title: "Не удалось подтвердить email",
            subtitle: "Ссылка могла истечь или уже была использована. Вернитесь в KYRNARC и запросите новое письмо.",
            button: "Открыть KYRNARC",
            close: "Эту вкладку можно закрыть.",
            badge: "!",
          },
        },
        en: {
          success: {
            title: "Email confirmed",
            subtitle: "Your KYRNARC account has been confirmed. Return to the app and tap “I’ve confirmed my email”.",
            button: "Open KYRNARC",
            close: "You can close this tab.",
            badge: "✓",
          },
          problem: {
            title: "Email confirmation issue",
            subtitle: "The link may have expired or already been used. Return to KYRNARC and request a new email.",
            button: "Open KYRNARC",
            close: "You can close this tab.",
            badge: "!",
          },
        },
      };

      // GoTrue puts its result in the URL fragment, never the query string
      // and never anything a static host's own server log would see --
      // read only here, client-side, and only to decide success vs
      // problem copy. Never displayed, never forwarded anywhere.
      var rawHash = location.hash || "";
      var hash = new URLSearchParams(rawHash.replace(/^#/, ""));
      var hasError =
        hash.has("error") ||
        hash.has("error_code") ||
        hash.has("error_description");

      var lang = (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
      var state = hasError ? "problem" : "success";
      var text = copy[lang][state];

      document.title = "KYRNARC";
      document.getElementById("badge").textContent = text.badge;
      document.getElementById("title").textContent = text.title;
      document.getElementById("subtitle").textContent = text.subtitle;
      document.getElementById("open-app").textContent = text.button;
      document.getElementById("close-note").textContent = text.close;
      document.documentElement.lang = lang;

      // Clear the fragment from the visible URL/history once we've read it
      // -- nothing here needs it again, and there is no reason for a
      // session token to keep sitting in the address bar or back-button
      // history after this point.
      if (rawHash && window.history && window.history.replaceState) {
        window.history.replaceState(
          null,
          "",
          location.pathname + location.search,
        );
      }

      // Never forward the fragment onward -- the app doesn't need GoTrue's
      // tokens from this link at all (it refreshes its own already-active
      // session instead, see AuthService.refreshSession()/AuthService
      // .signIn()), and forwarding would be the one way this page *could*
      // leak them.
    })();
  </script>
</body>
</html>
